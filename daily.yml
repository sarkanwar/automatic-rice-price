
name: Daily rice fetch & forecast

on:
  schedule:
    # 03:30 Asia/Kolkata = 22:00 UTC previous day
    - cron: "30 22 * * *"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch data & build forecasts
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          DATA_GOV_IN_RESOURCE_ID: ${{ secrets.DATA_GOV_IN_RESOURCE_ID }}
          COMMODITY_FILTER: ${{ vars.COMMODITY_FILTER || 'Rice' }}
          STATE_FILTER: ${{ vars.STATE_FILTER }}
          CENTRE_FILTER: ${{ vars.CENTRE_FILTER }}
          DATE_FROM: ${{ vars.DATE_FROM }}
          DATE_TO: ${{ vars.DATE_TO }}
        run: |
          python scripts/fetch_and_build.py

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/*.png data/*.json || true
          git commit -m "Auto update data & forecasts [skip ci]" || echo "No changes"
          git push
